                    "abstract": "Django Ninjaは、Djangoフレームワーク上でFastAPIのような高速で直感的なAPI開発を可能にするライブラリです。このトークでは、Django Ninjaの基本的な使い方から実際のプロジェクトでの活用方法までを網羅し、DjangoとDjango Ninjaを組み合わせた効率的なAPI開発手法を紹介します。\r\n具体的には、基本的なAPIエンドポイントの作成、認証と認可の設定、スキーマバリデーションの実装、そしてパフォーマンス最適化のためのベストプラクティスについて詳しく解説します。\r\nまた、Django Ninjaを実際のプロジェクトで使用する際に直面する可能性のある課題とその解決方法についても取り上げます。このトークは、Djangoを使用した経験がある開発者や、より高速なAPI開発を目指しているエンジニアに向けたものとなります。",

                    "abstract": "Pythonエコシステムにおいて、HTTPクライアントは非常に重要な役割を果たしています。特にWeb APIを使用したデータのやり取りや取得においては、適切なライブラリ選択が開発速度やアプリケーションのパフォーマンスに大きく影響します。本トークでは、Pythonの代表的なHTTPクライアントであるrequests、httpxなどのライブラリを徹底的に比較し、それぞれの特徴、利点、欠点を詳しく解説します。また、使用例を交えて、どのような場面でどのツールを選ぶべきかについて検討した結果を発表いたします。このセッションを通じて、自身のプロジェクトに最適なHTTPクライアントを選定するための知識と洞察を得ることができます。",
                    "description": "本トークでは、Pythonの代表的なHTTPクライアントライブラリであるrequests、httpx、urllib3、aiohttpなどを比較し、それぞれの機能、パフォーマンス、使いやすさについて詳しく解説します。特に、同期処理と非同期処理の違いやエラーハンドリングについて具体的なコード例を交えて紹介します。これにより、各ライブラリの強みと弱点を理解し、プロジェクトに最適なHTTPクライアントを選ぶためのヒントを習得することができます。具体的な使用シナリオに応じた推奨ライブラリの選定方法も紹介し、開発者が自身のニーズに最も適したツールを選べるようなヒントをお話します。これにより、HTTPクライアントライブラリの選定において、より確信を持って決定を下せるようになります。",

                    "title": "MicroPythonとRaspberry Pi Pico Wで始めるマイクロコントローラー上でのワイヤレス通信",
                    "track_id": 4687,
                    "state": "confirmed",
                    "abstract": "RaspberryPi PicoシリーズはLinuxが動作するRaspberry Piとは違い二つのCortex-M0+ プロセッサと264kbのSRAMと限られたリソースを搭載したRP2040というマイクロコントローラーを使った小さな基板のコンピューターです。\r\nこのようなマイクロコントローラーにMicroPythonインストールすることで限られたリソース下でもいつものPython感覚でプログラミングをすることができます。\r\n\r\nさらに2022年6月に発表されたRaspberryPi Pico Wと呼ばれる機種はWifiとBLE機能が追加されたことで例えばREST APIを呼び取得したデータを基板に接続したディスプレイに表示する、逆に基板に接続したセンサーの値をREST APIに送信するなど応用範囲が広がりました。\r\n\r\n発売当初はWifiのみのサポートでBLEは利用できなかったのですが2023年6月からC SDKでのBLEのサポートが始まりその後2023年10月リリースの v1.21.0からMicroPythonでもBLEのサポートが始まっています。\r\n\r\nRaspberry Pi Pico W自体も発売当初は手に入りづらかったものですが、今は秋葉原など店頭でも手軽に買えるようになっています\r\n応用範囲も広がり、気軽に買うこともできるようになったのでさらに開発も簡単にできることを伝えようと思い立ちました。\r\n\r\n今回のトークでは短い時間ですが基板上のLED、RP2040に内蔵された温度センサーとWifiやBLEでの通信をMicroPythonを使って組み合わせることでマイクロコントローラーでも使い慣れたPythonを使って簡単に開発ができることを紹介しようと考えています。\r\n(通信を主な話題にしたいため、外部のセンサーやディスプレイなどの扱い方については今回は触れないでおこうと考えています)",

                    "title": "Building Accessible Web Experiences with Python",
                    "track_id": 4683,
                    "state": "confirmed",
                    "abstract": "This session explores how Python empowers web development accessibility. We'll discuss using Python libraries like Selenium and PyTest to automate accessibility testing, enabling early detection of issues. Additionally, we'll delve into how Python's data analysis capabilities (NumPy, Pandas) aid accessibility research, allowing analysis of testing data and user behavior to improve evaluation methods. By making websites accessible, we create an inclusive and enjoyable web experience for everyone.",
                    "description": "Imagine the web as a giant library, but some people can't get in because the stairs are too high, the door is too narrow, or the signs are only in braille. That's what happens when websites aren't accessible!\r\n\r\nIn this session, we'll explore how Python acts as a powerful toolkit for championing accessibility in web development. We'll delve into two key areas:\r\n1. Automating Accessibility Testing with Python: We'll discover how libraries like Selenium and PyTest can be leveraged to create automated tests that simulate user interactions with disabilities. This approach will equip you to identify and resolve accessibility issues early in the development process.\r\n2. Leveraging Python for Accessibility Research: We'll explore how Python's data analysis capabilities, through libraries like NumPy and Pandas, empower accessibility research. We'll discuss how researchers use Python to analyze data from accessibility testing tools, discover user behavior patterns, and contribute to the creation of improved accessibility evaluation methods.\r\n\r\nAnd why do we need to discuss this? Think of it like building a ramp next to the stairs in the library. It doesn't just help people with wheelchairs, it also helps parents with strollers, people carrying heavy bags, and anyone who just wants an easier way in. Web accessibility is like that ramp, making the web more inclusive and enjoyable for everyone!",

                    "title": "Robot FrameworkとNVDAスクリーンリーダーによるアクセシビリティのテスト自動化",
                    "track_id": 4720,
                    "state": "confirmed",
                    "abstract": "このミニトークでは、スクリーンリーダーNVDAとRobot Frameworkを用いたシステムテストの自動化について紹介します。主に日本語Windows環境で検証し、独自のテストの組み込み、アクセシビリティサポーテッド（AS）情報への活用を検討します。\r\n\r\nスクリーンリーダーは視覚障害者にとって重要なツールであり、ウェブアクセシビリティを確保するためには、これらのツールが適切に動作することが重要です。NVDA は Python で開発されており WAI-ARIA: Authoring Practices Guide に基づいたブラウザテストも Robot Framework で自動化されています。\r\n\r\n参加者は、このミニトークを通じて、日本語環境でのスクリーンリーダーテストの重要性とその基本的な実践方法について理解を深めることができます。",
                    "description": "このミニトークでは、以下のポイントを説明します。\r\n\r\n1. **背景と重要性**:\r\n   - スクリーンリーダーNVDAとウェブアクセシビリティ\r\n   - 日本語環境での動作検証とAS情報\r\n\r\n2. **テストのセットアップと実装**:\r\n   - NVDAとRobot Frameworkの開発環境の構築\r\n   - WAI-ARIA: Authoring Practices Guideに基づくテストケースの実行\r\n   - 自動テストのカスタマイズ\r\n\r\n3. **デモと結果の共有**:\r\n   - 実際のテスト実行と結果の解析方法を紹介\r\n\r\nこれらのポイントを通じて、参加者は短時間でスクリーンリーダーを用いたテストの基本的な流れを理解し、実際の開発に応用するためのヒントを得ることができます。また、ウェブアクセシビリティ基盤委員会(WAIC)のAS情報の整備についても触れます。",

                            "code": "3CXZYS",
                            "name": "池嶋大樹",
                            "biography": "エムスリー株式会社\r\nAI・機械学習チーム　機械学習エンジニア\r\n\r\n2019年入社。\r\nユーザーの興味トピック推計システムの開発など、機械学習を使ったプロダクト開発に従事。\r\nMLOpsのためのパイプラインツール[gokart](https://github.com/m3dev/gokart)の開発にも参加。\r\n\r\nX: [@mski_iksm](https://x.com/mski_iksm)",

                    "title": "MLOpsの「あるある」な課題の解決と、そのためのライブラリgokart",
                    "track_id": 4695,
                    "state": "confirmed",
                    "abstract": "LLMを含め、機械学習技術は快適なアプリケーションを作成する上で、もはや欠かせない存在ではないでしょうか？一方で、「運用」という側面に目を向けると、機械学習はモデルの更新や入出力の変更など、普段のアプリケーション運用とは一味違った問題が出てきますよね。\r\n\r\n例えば、以下のような課題があがってくるかと思います。\r\n- 実験した機械学習モデルの再現性がない\r\n- モデルのバージョニングがごちゃごちゃになり、どの設定で作ったものかわからない\r\n- バッチ実行のたびに重複した処理を繰り返して非効率的\r\n- 似たような関数がプロダクトごとに重複して作られてしまう\r\n- 開発者によって書き方がばらつき、他メンバーが読みにくい\r\n\r\nこうした問題の解決には、「処理結果をキャッシュして、同じ処理は再実行しない」や「モデルとコードとを1:1で対応させる」といった戦略が効果的だと考えられます。これらの課題解決の知見を元に、エムスリーでは、MLOpsのためのライブラリ「gokart」を開発し活用してきました。\r\n\r\nこの発表では、MLOpsの「あるある」な課題とそれへの対処法に関して、今まで培ってきた知見と実際の実装を紹介していきます。ぜひお楽しみに！",
                    "description": "本発表は、主にMLOpsでの「あるある」な課題解消にフォーカスしています。\r\nLLMなどの発展もあり、今日では多くのアプリケーションに当たり前のように機械学習技術が組み込まれるようになってきました。\r\n機械学習エンジニアだけでなく、機械学習を活用するアプリケーションに関わる/関わりたい/関わることになりそうな、多くの方に価値をお届けできると考えています。\r\n\r\n## 想定オーディエンス\r\n- 機械学習モデルをアプリケーションへの組み込みに苦心している、機械学習エンジニア\r\n- データの収集から分析を効率的に実施したい、データサイエンティスト\r\n- MLOpsと日々格闘している、データエンジニア/ソフトウェアエンジニア\r\n- モデルの再現性やバージョン管理で困っている、リサーチャー\r\n\r\n\r\n## アジェンダ\r\n\r\n導入: 機械学習プロジェクトの「あるある」な課題\r\n- 実験した機械学習モデルの再現性がない\r\n- モデルのバージョニングが面倒\r\n- バッチ実行のたびに重複した処理を繰り返して非効率的\r\n- 似たような関数がプロダクトごとに重複して作られる\r\n- 開発者によって書き方がばらつき、他メンバーが読みにくい\r\n\r\nエムスリーでは「あるある」な課題をどう解消してきたのか？\r\n- 再現性: 作成した機械学習モデルのキャッシュを使うので、実験結果を再現できる\r\n- モデルのバージョニング: モデル作成のコードとモデルファイルが1:1で対応する\r\n- 同じ処理を繰り返す: 処理結果のキャッシュファイルを活用\r\n- 似た関数: 共通タスクを作って共有しやすい\r\n- 書き方のばらつき: クラス設計に縛りがあるので似やすい\r\n\r\ngokartの使い方紹介\r\n- Taskを作る\r\n- 依存関係を記述する\r\n- パイプラインを実行する\r\n\r\nさらに効率化するために\r\n- パイプラインの記述を1つのTaskに集約\r\n- TaskLockを使った分散処理\r\n\r\nもっと知るには？",

                    "track_id": 4686,
                    "state": "confirmed",
                    "abstract": "皆さんは「PEP 723 – Inline script metadata」（応募時 Status: Final）をご存知ですか？\r\n私の中ではこれはかなりインパクトの大きいPEPです。\r\nPythonでスクリプトを書くときの世界がガラッと変わる内容なんです！\r\n\r\nPythonでプロジェクトを開発するとき、仮想環境を使いますよね。\r\n開発者が作って有効にすることもあれば、それをPoetryやHatchなどのツールに任せることもあると思います。\r\nPythonスクリプトの開発でも同様に仮想環境を使います。\r\nPEP 723が劇的なのは、Pythonスクリプトの動作に必要な依存パッケージを、ツール側で自動で仮想環境にインストールしてスクリプトを動かしてくれるんです！\r\n**開発者はスクリプトのための仮想環境の操作から解放される**んですよ！！\r\n\r\n私はPEP 723を部分的にサポートしたpipx（`pipx run`）を愛用しています。\r\nその中で見えてきた使いこなしtipsと合わせて、皆さんをPEP 723を覗くクイックツアーへご案内します。\r\nちょっとしたスクリプトがすっごく書きやすくなりますよ〜",
                    "description": "# PEP 723とは\r\n\r\nref: https://peps.python.org/pep-0723/#example\r\n\r\n```python\r\n# /// script\r\n# dependencies = [\r\n#   \"requests\u003c3\",\r\n#   \"rich\",\r\n# ]\r\n# ///\r\n\r\nimport requests\r\nfrom rich.pretty import pprint\r\n\r\nresp = requests.get(\"https://peps.python.org/api/peps.json\")\r\ndata = resp.json()\r\npprint([(k, v[\"title\"]) for k, v in data.items()][:10])\r\n```\r\n\r\nこのスクリプトを動かすにはrichやrequestsが必要です。\r\nかつての私は仮想環境を作り、`pip install rich requests`してからスクリプトを動かしていました。\r\n\r\npipxは1.4.2からPEP 723を（部分的に）サポートしており、上のスクリプトは仮想環境を作ることなく`pipx run example.py`と実行できます！\r\n何が起こっているかと言うと\r\n\r\n1. pipxがInline script metadata（`/// script`のコメント）を解釈\r\n2. pipxが管理する仮想環境にdependenciesをインストール\r\n3. 2の仮想環境を有効にしてスクリプト`example.py`を実行\r\n\r\n開発者が仮想環境を操作不要なんです！（pipxに任せなさい🙌）\r\n\r\nこの世界を一緒に見ていく30分としたいと思います\r\n\r\n# アウトライン\r\n\r\n自己紹介・まとめ、それぞれ1分ずつ（2分）\r\n\r\n## PEP 723の紹介（8分）\r\n\r\n* Inline script metadataの仕様について\r\n  * dependencies\r\n  * requires-python\r\n* 提案経緯\r\n* 実装例（手短に）\r\n\r\n## PEP 723を実装するツールの紹介（13分）\r\n\r\n- pip-run（手短に）\r\n- pipx\r\n    * （dependenciesのみの限定サポートですが、とても便利です！）\r\n    * pipxとはどんなツールか\r\n    * pipx自体のインストールについて\r\n    * `pipx install`（手短に）\r\n    * `pipx run`\r\n- PEPによると、Hatchなどもサポートが予定されているので9月時点の最新情報を盛り込みます\r\n\r\n## PEP 723をサポートしたpipxでPythonスクリプトを開発・実行しての学びの共有（7分）\r\n\r\n* よい点1：一度動けば他の開発者の手元でも動く（環境の変化に強い）\r\n* よい点2：簡単に依存ライブラリを追加できる\r\n\r\n使いこなしtips\r\n* `python -i`相当のことをやるには？（pipxのソースコードリーディングから）\r\n* エディタ（VS Code）で補完があたるようにするには？",

                    "title": "Unlocking the Parallel Universe: Subinterpreters and Free-Threading in Python 3.13",
                    "track_id": 4686,
                    "state": "confirmed",
                    "abstract": "Python 3.12 introduced a new parallel execution model called \"sub interpreters\" that uses a per-interpreter GIL to unlock a new way of writing parallel code that's faster than multiprocessing. Python 3.13 introduces another new parallel execution model called \"free-threading\" (previously called no-gil) that replaces that optionally removes the GIL so that threads can truly be parallel. Does free-threading make sub interpreters redundant? We'll answer that question in this talk.",
                    "description": "Python 3.12 introduced a new parallel execution model called \"sub interpreters\" that uses a per-interpreter GIL to unlock a new way of writing parallel code that's faster than multiprocessing. Python 3.13 introduces another new parallel execution model called \"free-threading\" (previously called no-gil) that replaces that optionally removes the GIL so that threads can truly be parallel. Does free-threading make sub interpreters redundant? We'll answer that question in this talk. We unpack what sub interpreters are, how to use them and their limitations. We'll explore free-threading, the optional flag to remove the GIL in 3.13. Finally we look at a use case for sub interpreters and free-threading together, a multi-worker, multi-thread ASGI web server. We benchmark this against traditional web server architecture with multiprocessing and threading. So fasten your seatbelts, fellow Pythonistas! Let’s ride the comet tail of parallelism, leaving behind the single-threaded past. 🚀✨",

                    "description": "Pythonの公式ドキュメントのpatchの説明の冒頭に次のように書かれています。\r\n```\r\n注釈 重要なのは正しい名前空間に対して patch することです。 where to patch セクションを参照してください。\r\n```\r\nそして「どこにpatchするか」というセクションには次のような説明があります。\r\n```\r\n基本的な原則は、オブジェクトが ルックアップ されるところにパッチすることです。その場所はオブジェクトが定義されたところとは限りません。\r\n```\r\nこれを理解するためにはpythonの名前空間、スコープといった概念を理解する必要があります。\r\n- 名前空間とスコープ\r\n- import 文の働き\r\n- import foo と from foo import barの違い\r\n- どこにpatchするのか？\r\n等について公式ドキュメントをベースに説明します。",

                    "title": "あなたのアプリケーションをレガシーコードにしないための実践Pytest入門",
                    "track_id": 4720,
                    "state": "confirmed",
                    "abstract": "名著「レガシーコード改善ガイド」では、「テストがないコードはレガシーコード」と言われています。テストが無い（もしくは手動テストが大半を占める）アプリケーションは改修を重ねるたびにリリースが長期化し、いずれメンテナンス不可能なレガシーコードと成り果ててしまいます。\r\n\r\nどのような分野・規模のアプリケーションであっても、テストは不可欠です。更に、アプリケーションを構築・改修して素早くリリースするためには、「高速かつ何度でもテストを実行できる仕組み」が非常に重要となってきます。\r\n\r\n本セッションでは、Pythonの代表的なテストフレームワークである`pytest`を用いた実践的なテスト方法を紹介します。シンプルなテストケースだけでなく、DBやネットワーク、ファイル入出力、時刻、OS情報など、複雑な依存関係にあるコードのテスト方法を解説していきます。また、テスト駆動開発（`TDD`）に基づくテストファーストな開発手法にも触れていきます。",
                    "description": "本セッションでは、様々なPythonコードを`pytest`で自動テストする手法を解説していきます。\r\n\r\n- 昨年のPyConAPAC2023での先行発表「[好きとか嫌いとかはいい、練習してテストを書けるようになるんだ](https://2023-apac.pycon.jp/timetable?id=MBSPYH)」を更に発展させ、より複雑なコードをどのようにテストするかに焦点を当てて解説していきます。\r\n- コードが複雑なままだと、テストも必然的に複雑になります。本セッションでは単なる「`pytest`の使い方」の解説で終わらず、「テストを容易にするためのコードリファクタリング」も紹介し、テストを通じてコード品質を高める手法についても触れていきます。\r\n\r\nタイムテーブルは以下で進める予定です。\r\n\r\n1. 導入(5min)\r\n- 自己紹介\r\n- なぜテストが必要なのか？\r\n- なぜ単体テストの自動化を重視するのか？\r\n- テスト駆動開発（`TDD`）の紹介\r\n2. pytest概説(5min)\r\n- `AAA`を意識したテストケースの書き方\r\n- `fixture`による前処理・後処理の実装\r\n- `parametarize`によるパラメータテスト\r\n- `tmp_path`による一時ディレクトリの作成\r\n- `pytest-cov`によるテストカバレッジの取得\r\n3. 様々なテストパターンとリファクタリング(18min)\r\n- `DB`に依存するコード\r\n- `HTTP`リクエストするコード\r\n- ファイル入出力を行うコード\r\n- 特定の日時で動作するコード\r\n- `OS`情報に依存するコード\r\n4. まとめ(2min)",

                    "title": "Extracting Structured Data from LLMs with LangChain and Pydantic",
                    "track_id": 4684,
                    "state": "confirmed",
                    "abstract": "This talk dives into the exciting realm of enriching your Large Language Model (LLM) interactions with structured data extraction. We'll explore how LangChain, in conjunction with Pydantic, empowers you to retrieve not just plain text from LLMs but also reusable Python objects like lists, dictionaries, and even pandas DataFrames.",
                    "description": "Join me in this journey to understand and implement structured data extraction. With this powerful combination of tools, you'll learn how to craft data models using Pydantic's BaseModel for seamless integration with LangChain's output parser. Next, how to extract valuable information from LLM responses in structured formats like( lists, data frames), enabling further analysis and manipulation. And finally build supercharge LLM applications that require structured data transformations, parsing, or integration with machine learning models.\r\nWhether you're a data scientist, developer, or just curious about the possibilities of LLMs, this talk equips you with the skills to unleash the structured power of LLMs and build innovative applications.\r\n\r\n1. Introduction:\r\nHighlighting limitations of plain text LLM responses.\r\nIntroducing structured data extraction from LLMs.\r\nExposure to LangChain and Pydantic's power.\r\n\r\n2. Building the Data Model:\r\nDemo of defining data models with Pydantic's BaseModel.\r\nExploring lists, dictionaries, and pandas DataFrames.\r\nUnderstanding data model interaction with LangChain's parser.\r\n\r\n3. Structured Data Extraction:\r\nLive examples of querying LLMs for structured data.\r\nTransforming data for analysis.\r\nIntegrating data with ML models.\r\n\r\n4. Real-World Applications:\r\nPractical use cases of structured data extraction.\r\nBenefits and potential applications discussion.\r\n\r\n5. Conclusion:\r\nRecap of key learnings and future directions.\r\nExciting possibilities ahead.",

                            "code": "PHJAUM",
                            "name": "Prashant Anand",
                            "biography": "Hi, I am working as a Machine Learning Engineer at Mercari, Inc. for the last 5 years in Tokyo, Japan. At Mercari, I work in the Customer Support domain and lead the exploration and application of ML, NLP, and LLMs in this domain. I work with Japanese text and so far I’ve developed features like sending automatic reply to customer inquiries using LLMs and MLMs, routing of customer inquiries, and template suggestion. Outside of work, I like exploring specialty coffee shops, photography, playing piano, reading (especially poetry), working out in the gym, and occasional hiking trips.",

                    "title": "AI-powered Automatic Replies in Customer Support: Precision-Focused Approach at Mercari",
                    "track_id": 4684,
                    "state": "confirmed",
                    "abstract": "Have you ever had a frustrating experience with a customer support chatbot? Issues like misunderstandings, irrelevant responses, and endless loops without reaching a human agent are common. So why do we use AI for sending automatic replies to customer inquiries at Mercari? Does it benefit customers? How do we ensure a positive experience?\r\n\r\nAlong with answering these questions, in this talk, we will look at the design of our highly precise system using machine learning for automatic replies. We will focus on Python content in sections about introduction to transformers, fine-tuning pre-trained transformer models on Japanese text, and the design and training of our ML model. Lastly, we'll discuss our A/B testing methodology and the impact on business metrics from using automatic replies.",
                    "description": "Outline:\r\n\r\n- Introduction (2 minutes)\r\n    - Who am I?\r\n    - Problems with chatbots in customer support\r\n- So why do we use AI for customer support? (3 minutes)\r\n    - Examples of repetitive and trivial inquiries suitable for automatic replies\r\n    - Examples of inquiries where no action is needed, and only information needs to be conveyed\r\n    - Benefits to customers: instant response and resolution\r\n    - Benefits to businesses: cost savings\r\n- Ensuring a good experience with AI replies (3 minutes)\r\n    - Importance of precision in sending automatic replies\r\n    - Design choices for a good customer experience\r\n        - One-click escalation to human support agents\r\n        - Automatic replies only sent as the first response\r\n- Designing a precise system for automatic replies (17 minutes)\r\n    - Analyzing raw data to identify common inquiry patterns (1 minute)\r\n    - Utilizing metadata for extra context (transaction status, shipping method, item price, etc.) (1 minute)\r\n    - Introduction to transformers and their usage for text classification (5 minutes)\r\n    - Introduction to fine-tuning pre-trained transformer models for text classification on Japanese text (5 minutes)\r\n    - Designing and training ML models using inquiry texts and metadata (3 minutes)\r\n    - Calibrating precision using output thresholds (1 minute)\r\n    - Running A/B tests and impact on business metrics (1 minute)\r\n- Conclusion (2 min)\r\n- Q\u0026A (3 min)\r\n\r\n---\r\n\r\nAudience:\r\n\r\nDevelopers, data scientists, ML engineers, and business leaders interested in using AI to solve business problems including enhancing customer support operations.\r\n\r\n---\r\n\r\nOutcome:\r\n\r\nBy attending this talk, the audience will gain insights into how AI can be effectively used to enhance customer support while maintaining a positive customer experience. They will learn about the importance of precision in sending automatic replies, the process of analyzing customer inquiry data, and the use of machine learning techniques for text classification. The talk will also discuss the impact of implementing AI-powered automatic replies on business metrics.",

                            "biography": "Long-term Python developer, author, OSS contributor and speaker, Tushar currently works as a Software Engineer building language tools at DeepSource.\r\n\r\nWhen not working, he tries to contribute to the Python developer tools ecosystem, like black, ruff, flake8 and mypy.",

                    "title": "Crimes with the Python syntax",
                    "track_id": 4695,
                    "state": "confirmed",
                    "abstract": "Over the past few years digging into Python's runtime and language features, I've often run into some weird, obscure parts of the language. **Very** weird and obscure parts.\r\n\r\nSuch as imports being hackable enough to directly import JSON files. Or being able to change the syntax of the language, _at runtime_.\r\n\r\nAnd I'd note them down. All the weird, esoteric, not-to-be-named features of the language. And eventually, I'd find some way to abuse that feature. Do something heinous. Write code that would make any code reviewer question my sanity. _Committing crimes_, with the Python syntax.\r\n\r\nThis talk is an explainer of all these features, and why you should **never use them**. Unless, of course, you need to.",
                    "description": "Outline:\r\n\r\n- Introduction (2 minutes)\r\n- The convoluted Python import machinery (5 minutes)\r\n- Frame-hacking, and the `sys._getframe()` API. (5 minutes)\r\n- Tracers, debuggers, and changing your code at runtime. (5 minutes)\r\n- Bonus: `goto` statements in Python? (3 minutes)\r\n- Creating our own mini language inside Python, at runtime. (7-8 minutes)\r\n- Abusing the Python startup machinery to run arbitrary code. (7-8 minutes)\r\n- The end, and questionnaire. (10 minutes)",

                    "title": "FireDucksのすすめ",
                    "track_id": 4684,
                    "state": "confirmed",
                    "abstract": "日本発のデータフレームライブラリFireDucksを紹介します．探索的データ分析や機械学習の前処理などに使われるデータフレームライブラリとしては，老舗のpandasが有名ですが，最近はpolars, modin，そしてFireDucksなど新たなライブラリが登場しています．本トークでは，データフレームライブラリの最新動向を紹介し，FireDucksの開発者である発表者が，FireDucksの紹介を行います．\r\n\r\nFireDucksの特徴は，pandasとAPI互換で高速であることで，それを実現しているのがFireDucksに搭載された実行時コンパイラです．例えば，長年使われてきたpandasには様々な高速化ノウハウがありますが，FireDucksはそのようなノウハウを自動適用することで，速度を意識して書かれてないプログラムを高速化します．本トークでは，このようなFireDucksで行われている工夫を紹介し，FireDucksの速さの秘訣をデモを交えて紹介します．また，熟練者向けに，FireDucksでの実行時間プロファイルなどを用いた性能チューニング方法も紹介します．\r\n\r\n本トークを聞けば，pandasを使い始めたばかりの人から熟練者まで，きっとFireDucksを使ってみたくなるでしょう．\r\n\r\n※ FireDucksは`pip install fireducks`でインストール可能です．",

                    "title": "低コストで実現する社内文書RAG機能を搭載したAIチャットボット開発",
                    "track_id": 4684,
                    "state": "confirmed",
                    "abstract": "昨今における大規模言語モデル（Large Language Models, LLM）の技術進化は目まぐるしいものがあります。そのようなLLMの活用先の一つに、RAG（Retrieval-Augmented Generation）という技術があります。\r\nRAGとは、LLMによるテキスト生成に外部情報の検索を組み合わせることで、回答精度を向上させる技術です。\r\n本トークでは、AIチャットボットの要件・要求定義といった導入プロセスから、Slack AppとLangChainを用いた開発方法、RAGに必要な文書のベクトル化など、社内文書に基づく回答を行うことのできるRAG機能を搭載したAIチャットボットを、Pythonを用いて低コストで実現した取り組み全般についてご紹介します。",
                    "description": "## Overview\r\n私の所属するコネヒト株式会社では、LLMを用いた施策のPoCや業務改善に取り組んでいます。\r\nその中で、AIと気軽に触れ合える環境を提供することが非常に重要であると考え、OpenAI APIのリリース後にSlackからAIを体験できるSlack Appを開発しました。\r\nまた、社内文書を参照してAIに回答させたいというニーズの高まりと、RAG（Retrieval-Augmented Generation）という技術の登場により、社内文書に基づいた回答を生成する機能を追加で実装しました。\r\n\r\nこのRAGシステムをゼロから構築するためには、以下の点を考慮する必要があります。\r\n\r\n- データの収集と管理\r\n- ベクトル検索データベースの構築\r\n- コスト管理\r\n- ユーザーインターフェース etc ...\r\n\r\n特に、コスト面については多くの方が気になる点ではないでしょうか。LLMを活用する際に避けて通れない考慮事項として、運用コストが挙げられることが多いと思います。\r\n\r\n本トークでは、Slackを活用したAIチャットボットの構築と、そのチャットボットに社内文書に基づいた回答を生成させる機能（RAG）を低コストで実装した方法についてお話しします。\r\n\r\n前半では、Slack Appで実現するシンプルなAIチャットボットの開発方法について説明し、後半では、AIチャットボットに社内文書に基づいた回答を生成させる仕組み（RAG）の紹介や、RAGを実現する上でのポイントや低コストで実現するTipsについて紹介します。\r\n\r\n## Outline\r\n- 導入（3分）\r\n\t- 自己紹介\r\n\t- 概要説明\r\n\t\t- LLMやRAGといった前提知識の共有\r\n\t\t- このトークを聞いて得られるものの共有\r\n- OpenAI APIとLangChainを用いたAIチャットボットの開発（10分）\r\n\t- システム構成図の紹介（AIチャットボットの部分）\r\n\t- Slack Appとは\r\n\t- LangChainとは\r\n\t- OpenAI APIとLangChainを用いたAIチャットボットの開発方法\r\n- RAG機能の開発（10分）\r\n\t- システム構成図の紹介（RAG機能も取り入れた全体像）\r\n\t- Notion APIを用いた社内文書取得方法\r\n\t- LlamaIndexを用いた文書のベクトル化、ベクトル検索機能の実現方法、低コストで実現するためのTips\r\n- AIチャットボットをより使いやすくするためのTips（2分）\r\n\t- プロンプトの工夫\r\n- まとめと今後の展望について（2分）",

                    "title": "Pythonによるネットワーク分析の基礎とコミュニティサクセスへの応用",
                    "track_id": 4684,
                    "state": "confirmed",
                    "abstract": "ネットワーク分析は、人のコミュニケーション、画像、交通網など、様々な領域で見られる相互関係を解釈するために広く用いられる手法です。その自由度の高さと利用用途の広さから、とっかかりづらいと感じることも多いですが、非常に強力なツールです。\r\n\r\n本セッションでは、グラフ理論の基礎から始まり、Pythonを用いたネットワークグラフの作成と操作方法、統計的指標を用いたネットワークの理解まで、基礎的な内容をすべてカバーします。\r\n\r\nさらに、発表者の所属企業のプロダクト「Commune」における実践的なコミュニティサクセスのためのネットワーク分析の活用事例を紹介します。最後に、ご参加いただいてる皆様がネットワーク分析できるように、一般的なアクセスデータをネットワーク分析の入力データとして変換する方法についても解説します。\r\n\r\nこのセッションを通じて、ネットワーク分析の基礎から応用事例、データ収集方法までを広く紹介し、自身のプロジェクトに即座に適用できる知識と技術を提供します。",
                    "description": "### 1. 自己紹介, 発表の全体像の紹介（3分）\r\n\r\n### 2. ネットワーク分析の基礎（7分）\r\nネットワーク分析の基本概念を紹介します。\r\n\r\n- 数学的な表現方法や基礎概念の紹介\r\n    - 頂点（ノード）と辺（エッジ）の説明\r\n    - 隣接行列と次数分布､辺リストなど\r\n- ネットワークの分析の多様なアプローチの紹介\r\n    - **森（全体俯瞰）**:\r\n        - ネットワーク可視化したり、クラスタ係数などの特徴量の計算\r\n    - **林（中間レベル）**:\r\n        - クラスタリングを行ったり、経路上のボトルネックを特定し、ネットワーク内の特徴となる経路やグループの発見\r\n    - **木（個別の特徴）**:\r\n        - 将来の友人関係の予測や口コミ情報の伝搬促進・抑制を行ったり、ネットワークの中で中心的な存在となる頂点を同定するなど\r\n- 実世界の事例の説明\r\n\r\n### 3. Pythonでのネットワークグラフの作成と操作（6分）\r\n\r\nPythonのNetworkXライブラリを用いて、ネットワークグラフを作成し、操作する方法をデモンストレーションします。\r\n\r\n- NetworkXの基本：\r\n    - グラフの作成方法、頂点と辺の追加方法\r\n    - 基本操作（ノードやエッジの削除、属性の追加）\r\n- 基本的な分析：\r\n    - 次数中心性、媒介中心性、コミュニティの計算方法と理論の簡単な説明\r\n\r\n### 4. ネットワーク分析の応用（8分）\r\n\r\n「Commune」のデータセットを用いた、ネットワーク分析の応用事例を紹介し、コミュニティサクセスにどのように活用できるかを説明します。\r\n\r\n- コミュニティの全体像を理解する：\r\n    - クラスター係数、次数分布とべき則のフィッティングを用いてネットワークを評価\r\n    - ネットワークの可視化方法と手法の解説\r\n- 具体的な応用例：\r\n    - リンク予測による引き合わせたい人のペアの発見\r\n    - 中心性指標を用いた中心人物の特定\r\n    - ネットワーク上のコミュニケーションのボトルネック（ブリッジの欠如や中心性の偏り）の評価\r\n\r\n### 5. データの取得方法（3分）\r\n\r\nネットワーク分析に必要なデータをどのように取得するかについて具体例を紹介します。\r\n\r\n- データソース：メール、Slackのユーザーアクティビティログなど、日常的に使用するツールからのデータ収集方法を解説します。\r\n- データの前処理方法：収集したデータをネットワークデータに変換する方法を説明し、二頂点間をつなぐ辺と重みに変換する方法を示します。\r\n\r\n### 6. まとめとQ\u0026A（3分）",

                    "title": "実践structlog",
                    "track_id": 4720,
                    "state": "confirmed",
                    "abstract": "クラウド時代のログ出力では、JSONによる構造化ログや呼び出し元のコンテキストを含めた出力が必要とされます。このトークではstructlogを使い、実際のWebアプリケーション開発でDjango、Celery、Sentryのコンテキストを繋いでログ出力する例を紹介します。",
                    "description": "structlogはOut-Of-The-Boxで簡単に使える便利なログ出力ライブラリ、ではありません。使いやすいラッパーライブラリは気軽に使い始められるメリットがあります。しかし、ある程度複雑な構成で標準ライブラリやフレームワークのログ出力もまとめて扱うには、始めやすさよりも、追跡しやすいログを簡単なコードで手軽に出せることが大事になってきます。\r\nクラウド時代のログ出力では、ログを機械的に扱えるように、構造化されたJSONフォーマットが求められます。また、各ログの追跡可能性を高めるためにはログのコンテキスト情報をフレームワークのログ出力にも含めることが求められます。こういった追跡可能なログによって、トラブル時の調査にかかる労力は大幅に削減されます。\r\nstructlogはこのようなニーズに合わせて自由にカスタマイズが可能ですが、そのカスタマイズ性の高さは最初の導入ハードルにもなっています。",

                    "title": "ORM と向き合う",
                    "track_id": 4683,
                    "state": "confirmed",
                    "abstract": "このセッションでは、ORM という概念にどのような難しさがあるか、我々は ORM に何を期待するのか、Python においてはどのような選択肢があるのかについて考えていきたいと思います。このセッションでは「正解」を提示することはできないと思いますが、みなさんが \"なんとなく使っている\" (かもしれない) ORM について、少しでも深く理解するためのきっかけを与えることができれば幸いです。",
                    "description": "アプリケーションを開発する際に RDB を組み合わせるケースは非常に多く、アプリケーションから RDB を扱うために ORM と呼ばれるソフトウェア/ライブラリを利用したことがある人も多いでしょう。ORM を使ったことがある人であれば、ORM という概念はそれほど簡単に扱える代物ではないということは同意いただけるのではないでしょうか。\r\n\r\nこのセッションでは、ORM という概念にどのような難しさがあるか、我々は ORM に何を期待するのか、Python においてはどのような選択肢があるのかについて考えていきたいと思います。このセッションでは「正解」を提示することはできないと思いますが、みなさんが \"なんとなく使っている\" (かもしれない) ORM について、少しでも深く理解するためのきっかけを与えることができれば幸いです。\r\n\r\n- 代表的な ORM とその特徴\r\n    - Python の ORM\r\n    - 他の言語の ORM\r\n- ORM 周辺の課題\r\n    - インピーダンスミスマッチ\r\n    - 複雑さ\r\n    - 型定義\r\n    - 最適化\r\n    - 非同期処理\r\n    - etc...\r\n- これからの ORM\r\n    - ORM に期待するもの\r\n    - Python における選択肢や実装",

                            "avatar": "https://pretalx.com/media/avatars/Y9CTJG_eyx92n6.jpeg"
                        }
                    ],
                    "title": "5年分のツケを一気に払った話",
                    "track_id": 4695,
                    "state": "confirmed",
                    "abstract": "コンピュータに詳しいメンバーが便利な業務システムを作ってくれたけど、そのメンバーがいなくなった後で困る、というのはよくある話です。とはいえ、書いてくれたコードを理解することができれば、そのシステムを維持していくことはなんとか可能です。\r\n\r\n私の部署でも5年前、コンピュータに詳しいメンバーがパソコンサーバーを組み立て、Ubuntuをインストールしてそのマシン上にPythonで便利な業務システムを作ってくれました。そのメンバーが抜けた後も、残されたメンバーでドキュメントを整備したり、テストを書いたりしてなんとか維持運用してきました。でも動かなくなってしまうと業務上困るので、OSやPythonのバージョンはそのままにしていました。いわばツケを5年にわたって溜め続けている状態でした。\r\n\r\nそんな中、気がつけばUbuntuもPythonもサポート期間が終了してしまい、パソコン本体の保守期間も切れたため、システムを別マシンに移行することが決まりました。\r\nこのトークでは5年分の環境変化に一気に対応するために生じた様々な問題（詳細欄参照）を解決するための苦労話を通じて、みなさんが同じ轍をふまないための教訓をお伝えしたいです。",
                    "description": "## トークを通じて伝えたいこと\r\n\r\n問題なく動いているシステムを修正するリスクをとるのは怖い。特にドキュメントもテストもなく、書いた本人もいなくなったコードが業務で使われている場合はリスクしかない、と言っても良い。そういう状況下ではpandasやnumpyといったパッケージがバージョンアップしたというだけの理由で新しいバージョンに対応するためだけの修正は先送りされがちである。\r\n\r\n私は、「ドキュメントなし、テストなし、書いた本人もいない」という状態で引き継いだコードにドキュメントをつけ、テストを書き、自分以外のメンバーもそのコードをメンテナンスできるようにレクチャーをしてきたが、パッケージのバージョンアップ対応は避けてきていた。言い訳になるが工数的な余裕がなかったこともあるし、非エンジニア組織なので周囲の理解が得にくいという状況もあってリスクをとる勇気がなかった。\r\n\r\n今回、諸事情から別マシンへの移行を余儀なくされるにあたり、移行のための工数確保が認められたので、これ以上の先送りはやめよう、とPythonのバージョンを3.6から3.11に上げる決断をした。\r\nこのトークでは移行にあたって直面した、さまざまな問題の中から、サードパーティパッケージのバージョンアップに伴って発生した問題点5つに絞ってご紹介する（OSやネットワーク環境の変更にともなう問題もいろいろあったが割愛）。\r\n\r\n問題点配下の通り（トークでは原因をどう見つけたかも含めて説明予定）\r\n\r\n### 問題1：pandasのエラーチェックが厳しくなった\r\npandas.DataFrame.to_dict()関数でエラー発生。原因はorientパラメタのtypo。以前のpandasでは1文字目だけ見て判断していたので\"records\"とすべきところが\"record\"でも\"recrods\"でも動作していたが、pandas2.0以降は”records”と正しく書かないとエラーになる。typoを修正することで解決\r\n\r\n### 問題2: scikit-learnのモジュールのパラメータ仕様が変わった（3分）\r\nsklearn.linear_model.LogisticRegressionクラスのsolverパラメータのデフォルト値が以前はliblinearだったのが0.22以降lbfgsに変わったため、penalty=\"l1\"を指定するとエラーになる。solver=\"liblinear\"と明示的に指定することで解決\r\n\r\n他にもimblearn.under_sampling.RandomUnderSamplerクラスのratioパラメータ廃止など、複数のモジュールで問題発生。個別に解決した\r\n\r\n### 問題3: mongodbのAPI変更に伴いpymongoの関数も変わった（3分）\r\n以前のpymongoではcollection.save()関数で、レコード追加なのかレコード更新なのかをいい感じに判断してくれていたがMongoDB4.2以降でdb.collection.save()というAPIが廃止されたためpymongoでも使えなくなった。insert_one()関数かreplace_one()関数かを明示的に指定することで解決\r\n\r\n### 問題4: PyPIのborutaパッケージが2019年以降更新されておらず最新のnumpyに対応していない（3分）\r\nPyPIのborutaパッケージを呼び出して使っているが、このパッケージが2019年以降更新されておらず、内部でnp.intやnp.floatを使っている。np.intやnp.floatはnumpy1.20で廃止されておりこのままではエラーになる。\r\nパッケージのソースコードにパッチを当て、np.intをnp.int32、np.floatをnp.float64などに修正することで解決\r\n\r\n### 問題5: 保存したpickleを読み込むとエラー（5分）\r\n機械学習で作成したモデルをpickle形式で保存し、後日呼び出せる仕組みになっていたが、scikit-learn0.23のときにあったsklearn.preprocessing.dataモジュールがscikit-learn1.3では名前が変わっており過去に作ったpickleを呼び出すとエラーになる（他にもいくつか同様のモジュールあり）\r\n\r\nこれはデータの問題でありコード修正では解決できない。部署内で相談のうえ、過去の分析結果は新環境に引き継がないという判断をして解決（過去データを呼び出して利用する仕組みは別途構築）\r\n\r\n##  得られた教訓と今後に向けて\r\n\r\nドキュメントもテストもない、という状態で4年前に引き継いだコードにドキュメントをつけ、テストを書き、複数メンバーでコード修正ができるようにPython講習も重ねてきたが、リファクタリングは先送りしていた。\r\n\r\n常に、とまでは言わないが定期的に最新の環境下でリファクタリングが実施できていれば、今回紹介した5つの問題に同時に直面する、ということはなかったはず。\r\n\r\n安心してリファクタリングができるようになるためには、ドキュメントやテストがちゃんとしているということは前提。新規に作るものはドキュメントとテストを最初からきちんと用意し、その上で定期的なリファクタリングをおこなうための工数を確保していきたい。\r\n\r\n## 目次と30分の時間配分案\r\n\r\n- 自己紹介（2分）\r\n- 概要説明（5分）\r\n- 発生した問題とその解決方法（解決難度の低い順。5つの問題計16分）\r\n    - 問題1: pandasのエラーチェックが厳しくなった（2分）\r\n    - 問題2: scikit-learnのモジュールのデフォルトパラメータが変わった（3分）\r\n    - 問題3: mongodbのAPI変更に伴いpymongoの関数も変わった（3分）\r\n    - 問題4: PyPIのborutaパッケージが2019年以降更新されておらず最新のnumpyに対応していない（3分）\r\n    - 問題5: 保存したpickleを読み込むとエラー（5分）\r\n- 得られた教訓と今後に向けて（5分）\r\n（バッファ2分）",

                    "title": "Fun with microcontrollers: Building a digital sundial using Python",
                    "track_id": 4687,
                    "state": "confirmed",
                    "abstract": "Using Python to program physical devices is both possible and fun.\r\n\r\nLet’s explore what you can accomplish with just a bit of Python, a microcontroller, and a small display by using them to build a digital sundial that you can carry in your pocket.",
                    "description": "The objective of this talk is to show how easy it is to build a Python application which runs on a single board computer. It will walk attendees through the steps of getting a Python application running on a microcontroller that is attached to a small display.\r\n\r\nWe use a circle drawn on the display to show the sundial broken into its different parts – dawn, daytime, twilight, and night. In order to correctly calculate the boundaries between these parts, we need the local time for solar day events.\r\n\r\nFor a given latitude-longitude, we can get that data from the sunrise-sunset.org API, the use of which is free (as long as attribution is given). Once we have the details for solar events, we have all the information we need to draw the sundial on the display.\r\n\r\nThe rest of the presentation shows the implementation of the digital sundial - both the Python code and the hardware.\r\n\r\nNOTE: Depending on which ends up working better, the hardware platform used will either be a Raspberry Pi Zero using CPython or an Adafruit Feather M4 Express using CircuitPython.",

                {

                            "biography": "Liu is a software engineer working in Tokyo. He uses the ID, @tigercosmos, in open-source communities. He likes photography, snowboarding, and traveling. His website: https://tigercosmos.xyz",
                            "avatar": "https://pretalx.com/media/avatars/P7YJCV_ohfNu7F.jpg"

                    "title": "Crafting Your Own Numpy: Do More in C++ and Make It Python",
                    "track_id": 4685,
                    "state": "confirmed",
                    "abstract": "Numpy is a powerful tool for scientific computing, but large-scale simulations need more.  The high-performance computing calls for a custom array library that can be customized in C++ and interact with Python. A great way to do it is to use Pybind11. Just like Numpy, we allow arrays to use various data types while providing a single array type in Python. In C++, we use template generic programming for array code of specific data types. This talk shares the approaches to overcome the \"dtype\" challenge, so we can leverage the C++ typing information at compile-time for high performance and seamless Python integration.",
                    "description": "While most people typically use Numpy directly, as it generally meets their needs well, there are specific scenarios where a custom array library is necessary. In high-performance computing, real-time data processing, and large-scale simulations, users may require a library with a Numpy-like interface that offers enhanced performance and greater flexibility.\r\n\r\nWe created an array library similar to Numpy, providing a comparable interface, high performance, and a high degree of customization. While Pybind11 allows us to bind C++ classes to Python objects easily, thus simply binding a C++ array to a Python object, challenges arise regarding the \"dtype\" of the array.\r\n\r\nWith Numpy, we can create arrays using syntax like `np.array([...], dtype='float64')` to specify the underlying data type as \"float64\". Despite the specified \"dtype\", all Numpy arrays are always of the type \"numpy.ndarray\".\r\n\r\nIn designing a Numpy-like array, we encountered an issue with this \"dtype\". Considering the C++ array templates with different data types, such as `Array\u003cT\u003e`, each data type results in a different template type, like `Array\u003cint\u003e` or `Array\u003cdouble\u003e`. However, we want to maintain a single array type on the Python side, so we cannot simply bind `Array\u003cT\u003e` to a Python object.\r\n\r\nThis talk will explain our approach to addressing the \"dtype\" challenge in building our own Numpy-like library by leveraging C++'s compile-time type knowledge.",
